<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Центр карьеры — FNCS Career</title>
  <meta name="theme-color" content="#0f2a66" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">FN</span>
        <span class="brand-name">FNCS<span>&nbsp;CAREER</span></span>
      </a>
      <nav class="header-nav">
        <a href="index.html">Главная</a>
        <a href="career.html">Изменить игрока</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="dash-wrap">
      <div class="container">
        <div id="playerBar"></div>
        <nav class="subnav" id="subnav">
          <button class="tab-btn active" data-tab="center">Центр</button>
          <button class="tab-btn" data-tab="profile">Профиль</button>
          <button class="tab-btn" data-tab="career">Карьера</button>
          <button class="tab-btn" data-tab="training">Тренировка</button>
          <button class="tab-btn" data-tab="calendar">Календарь</button>
          <button class="tab-btn" data-tab="tables">Таблицы</button>
          <button class="tab-btn" data-tab="shop">Магазин</button>
          <button class="tab-btn" data-tab="history">История</button>
        </nav>
        <div id="tabContent"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span data-year>2026</span> FNCS Career — фан-проект. Не связан с Epic Games.</span>
      <span>Демо-версия · без бэкенда</span>
    </div>
  </footer>

  <!-- Training minigame -->
  <div class="tmodal" id="trainModal" hidden>
    <div class="tmodal-back" data-close></div>
    <div class="tmodal-card">
      <div class="tm-head"><h3 id="tmTitle">Тренировка</h3><button class="tm-x" type="button" data-close>✕</button></div>
      <p class="tm-desc" id="tmDesc">Лови цели как можно быстрее — чем больше попаданий, тем выше прирост.</p>
      <div class="tm-hud"><span>Время: <b id="tmTime">5</b>с</span><span><span id="tmHitsLabel">Попаданий</span>: <b id="tmHits">0</b></span></div>
      <div class="tm-zone" id="tmZone"><button class="tm-start" id="tmStart" type="button">Начать</button></div>
      <div class="tm-result" id="tmResult" hidden></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
